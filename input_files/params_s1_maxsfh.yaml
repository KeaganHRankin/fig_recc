# Configuration for FIG-RECC sampler
# Scenario: caps single-family share of the sampled neighbourhoods.
# Scenario files are standalone - copy this file and edit to add a new scenario.

## General parameters
scenario_name: s1_maxsfh # outputs are written to data_cache/<scenario_name>/
period_step: 10 # number of years between time steps
base_year: 2020 # base year for sampler.

# Future model planning periods
model_periods:
  - 2020
  - 2030
  - 2040
  - 2050
  - 2060

## Scenario parameters files
pop: "iloilo_scenar_reference/population.csv" # population time series for city.
m2_per_p: "iloilo_scenar_reference/m2_per_person.csv" # m2 per person for res/non-res buildings.
neighbourhoods: "iloilo_scenar_reference/nb_iloilo.csv" # census data formatted for input.

## Neighbourhood sample constraint parameters
constraints:
  # these are the basic constraints.
  need_cond: 'm2' # 'bottom-of-donut' need condition to meet for sampling = ['m2',...].
  max_sfh_share: 0.95 # maximum single-family share

## Additional user-specified splits to export
# any number of neighbourhoods.csv columns to export as extra split CSVs, on top of the default
# RECC outputs. Each column is passed to FIGRECCSampler.get_x_split() and written to
# data_cache/<scenario_name>/<column>_split.csv.
extra_splits:
  - mat_floor
  - mat_roof
  - mat_wall
  - n_floors
